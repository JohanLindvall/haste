name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests supersede themselves; pushes to main do not, because the tag
# job at the end of one must not be cancelled by the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: gofmt and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The root module has no go.sum -- it imports nothing -- so the
          # cache keys on the bench module's, which this job builds.
          cache-dependency-path: bench/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - name: go vet (bench module)
        run: cd bench && go vet ./...

  test:
    name: test ${{ matrix.arch }} go${{ matrix.go }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 on stable, and again on the minimum go.mod declares.
          - { runner: ubuntu-latest, arch: amd64, go: stable }
          - { runner: ubuntu-latest, arch: amd64, go: "1.21" }
          # arm64 natively, which is the only way the NEON kernels get executed
          # rather than simulated.
          - { runner: ubuntu-24.04-arm, arch: arm64, go: stable }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # nothing to key on: the root module has no go.sum
      # Informational: which kernel this runner actually picked. Never fails
      # the job on its own; the real run is the next step.
      - name: which kernel this runner dispatched to
        run: go test -run TestBackendsNative -v . 2>&1 | grep dispatched || true
      - run: go test ./...
      - name: purego
        run: go test -tags purego ./...
      - name: race
        run: go test -race ./...
      - name: race, purego
        run: go test -race -tags purego ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # nothing to key on: the root module has no go.sum
      # endian_slow.go exists for the big-endian and unaligned-access
      # architectures, and none of them can be run here. Building the test
      # binary is the least that has to hold: internal/asmgen is imported by
      # asmsim_test.go, so a generator-only mistake can take the whole suite
      # down on an architecture nobody is watching.
      - name: build the test binary for every supported architecture
        run: |
          set -e
          for a in 386 arm mips mipsle s390x ppc64 ppc64le riscv64 loong64 arm64 amd64; do
            echo "== linux/$a"
            GOOS=linux GOARCH=$a go test -c -o /dev/null .
            GOOS=linux GOARCH=$a go test -c -o /dev/null ./xxh64
          done
          # The other operating systems the assembly and the core detection
          # have to compile for. arm64 outside Linux takes a different file --
          # MIDR is unreadable there -- and nothing else here would build it.
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go test -c -o /dev/null .
            GOOS=${t%/*} GOARCH=${t#*/} go test -c -o /dev/null ./xxh64
          done
          echo "== js/wasm"
          GOOS=js GOARCH=wasm go build ./...

  qemu:
    name: forced SSE2 and AVX2 dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # nothing to key on: the root module has no go.sum
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: GOARCH=amd64 go test -c -o /tmp/xxhaste.test .
      - run: GOARCH=amd64 go test -c -o /tmp/xxh64.test ./xxh64
      # Named CPUs rather than -cpu max: they pin which kernel dispatch has to
      # pick, and neither advertises AVX-512, which qemu's TCG does not
      # implement. -test.short skips the job that shells out to the assembler.
      # The XXH64 kernel has no dispatch to force; it runs here for the second
      # execution environment.
      - name: AVX2 (Haswell)
        run: qemu-x86_64-static -cpu Haswell /tmp/xxhaste.test -test.short
      - name: SSE2 (Nehalem)
        run: qemu-x86_64-static -cpu Nehalem /tmp/xxhaste.test -test.short
      - name: XXH64 (Nehalem)
        run: qemu-x86_64-static -cpu Nehalem /tmp/xxh64.test -test.short

  generate:
    name: generated assembly is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # nothing to key on: the root module has no go.sum
      - name: cross-assemblers for both targets
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-x86-64-linux-gnu binutils-aarch64-linux-gnu
      # The test skips a backend whose assembler is missing, so a passing run
      # proves nothing on its own. Both toolchains are installed above; assert
      # that nothing skipped, or this check silently stops checking.
      - name: regenerate and diff against what is checked in
        run: |
          set -o pipefail
          go test -run TestGeneratedFilesUpToDate -v . 2>&1 | tee /tmp/gen.log
          if grep -q -- "--- SKIP" /tmp/gen.log; then
            echo "::error::a backend skipped; its cross-assembler is missing, so the check did not run"
            exit 1
          fi

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # nothing to key on: the root module has no go.sum
      # Discovered, not listed: a hand-kept list silently stops covering a
      # new target or a new package, and this one already went stale once
      # when xxh64 arrived. Go allows one -fuzz target per invocation, hence
      # the loop. A run with zero targets discovered is a discovery failure,
      # not a clean pass.
      - name: one minute per discovered target
        run: |
          set -euo pipefail
          total=0
          for pkg in $(go list ./...); do
            for f in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "== $pkg $f"
              go test -run "^$f$" -fuzz "^$f$" -fuzztime=60s "$pkg"
              total=$((total + 1))
            done
          done
          echo "$total fuzz targets ran"
          if [ "$total" -eq 0 ]; then
            echo "::error::no fuzz targets discovered; the -list probe is broken"
            exit 1
          fi
      - name: keep any input that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  crosscheck:
    name: cross-check against zeebo/xxh3 and cespare/xxhash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The root module has no go.sum -- it imports nothing -- so the
          # cache keys on the bench module's, which this job builds.
          cache-dependency-path: bench/go.sum
      - run: cd bench && go test ./...

  tag:
    name: tag
    needs: [check, test, cross, qemu, generate, fuzz, crosscheck]
    # Dispatch counts as well as push, which makes "run CI and release what
    # is ready" a button rather than an empty commit. It is safe to press
    # twice: the step below does nothing when HEAD already carries a tag or
    # when no module file has changed since the last one. The ref check is
    # what keeps it to the default branch either way.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, to diff against the last release
          fetch-tags: true # and the tags, which are the whole input here
      - name: cut the next patch version
        run: |
          set -euo pipefail

          # Fetch the tags explicitly rather than trusting the checkout to
          # have them. Whether it does has depended on the action's version
          # and on fetch-depth, and this job reads exactly one thing from the
          # repository -- if that read comes back empty the version restarts
          # at v0.1.0, which is a wrong answer rather than an error. One
          # fetch removes the question.
          git fetch --tags --force --quiet origin

          tags=$(git tag -l 'v*' | grep -cE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "visible release tags: $tags"
          if [ "$tags" -eq 0 ] && git ls-remote --tags --quiet origin 'refs/tags/v*' | grep -q .; then
            echo "::error::the remote has release tags but none are visible here; refusing to restart versioning"
            exit 1
          fi

          # A re-run, or a release cut by hand, already has its tag.
          if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "HEAD is already $tag; nothing to do."
            exit 0
          fi

          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            # Only the module's own files warrant a version: a README edit is
            # not something anyone can "go get".
            #
            # Measured from the last tag rather than from this push. Rapid
            # pushes supersede each other's queued runs, and such a run never
            # tags; asking what *this push* changed then strands that commit's
            # code behind the next documentation-only push, which is exactly
            # what happened to b8003eb between v0.1.1 and v0.1.2. Asking what
            # has not shipped yet is self-healing.
            if [ -z "$(git diff --name-only "$latest" HEAD -- '*.go' '*.s' go.mod go.sum | head -n1)" ]; then
              echo "Nothing under Go, assembly or the module files has changed since $latest; not tagging."
              exit 0
            fi
            v=${latest#v}
            major=${v%%.*}
            rest=${v#*.}
            minor=${rest%%.*}
            patch=${rest##*.}
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "latest=${latest:-none}, next=$next, HEAD=$(git rev-parse --short HEAD)"

          # An existing $next means the state this job derived from is not the
          # state of the remote. Say which, rather than exiting 1 with nothing
          # to go on -- that is what the last failure here looked like.
          if remote=$(git ls-remote --exit-code --tags origin "refs/tags/$next" 2>/dev/null); then
            echo "::error::$next already exists on the remote (${remote%%$'\t'*}); computed from latest=${latest:-none}"
            exit 1
          fi
          # Through the refs API, not `git push`. Pushing a tag whose commit's
          # .github/workflows content differs from the default branch's tip is
          # refused outright for GITHUB_TOKEN:
          #
          #   refusing to allow a GitHub App to create or update workflow
          #   .github/workflows/ci.yml without `workflows` permission
          #
          # There is no `workflows` key to add to the permissions block. It is
          # a platform rule, not a setting: an automatically issued token must
          # not be able to rewrite the automation that decides its own
          # privileges. Every tag up to v0.1.16 predates the workflows
          # changing, which is why this only started failing now.
          #
          # The API creates a ref pointing at a commit already on the branch,
          # rather than pushing workflow content, so it is not the same
          # operation. If it turns out the rule covers this path too, the
          # error below says what to do about it instead of leaving a bare
          # exit code.
          code=$(curl -sS -o /tmp/tagresp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/tags/$next\",\"sha\":\"$GITHUB_SHA\"}")
          if [ "$code" = "201" ]; then
            echo "created $next on $GITHUB_SHA"
            echo "### Tagged \`$next\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "HTTP $code from the refs API:"
          cat /tmp/tagresp.json
          echo
          echo "::error::could not create $next (HTTP $code). If the message above is the workflows-permission rule, this job needs a token carrying the workflow scope -- a PAT or App token in a secret -- in place of GITHUB_TOKEN."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
