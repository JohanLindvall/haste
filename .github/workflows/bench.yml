name: bench

# A benchmark sweep across the Linux and Windows runner pools, both
# architectures, run by hand: every comparison benchmark in bench/, the
# kernel-level backend benchmarks of all three packages, and the per-length
# sweep. Results are uploaded raw; the analysis happens elsewhere. Runner VMs
# are shared and noisy, so numbers from here are for shape and ratios, not
# for the README. macOS is not swept -- see the matrix.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "benchmark repetitions (-count)"
        default: "3"
  # A pull request runs it too: that is how the sweep is started from a
  # branch, since a dispatch needs the workflow to exist on the default branch
  # first. Only pull requests from a branch named bench-* run it, so ordinary
  # pull requests do not pay for a sweep.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    name: bench ${{ matrix.runner }}
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'bench-')
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The Linux and Windows families, on both architectures.
        # ubuntu-22.04 used to be a row; its image starts brownouts on
        # 2026-09-17 (actions/runner-images#14254), and it was the same x86
        # pool as 24.04 under an older image anyway. The windows rows run
        # under bash; a row whose image has no C compiler just loses the C
        # reference columns, nothing else.
        #
        # macos-latest and macos-15-intel were rows until 2026-08-31,
        # dropped for cost: GitHub bills a macOS minute at ten times a
        # Linux one, and this is the longest job in the repository. They
        # were also the two least trustworthy rows -- three dispatches
        # spread 20.8% on the virtualized M1 and 12.4% on the Intel one,
        # against the arm64 Linux runner's 0.1% -- and Apple silicon is
        # the one platform whose numbers in CLAUDE.md come from dedicated
        # hardware anyway.
        #
        # What goes with them is darwin's only *execution* anywhere in CI:
        # ci.yml cross-compiles darwin/amd64 and darwin/arm64 but runs
        # neither, so `internal/cpu/os_darwin.go` and the Apple branch of
        # xxh64's arm64 dispatch are now compiled and never taken. Both
        # lane-round forms are still executed on ubuntu-24.04-arm, which
        # forces each through setBackend; it is the selection, not the
        # kernel, that stops being covered. Re-add a row if that changes.
        runner:
          - ubuntu-24.04-arm
          - ubuntu-24.04
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The root module has no go.sum; the cache keys on the bench
          # module's, which every step here builds against.
          cache-dependency-path: bench/go.sum
      # A runner with no usable C toolchain still has CGO_ENABLED=1 by
      # default, and then every build of bench/ fails outright instead of
      # dropping the C reference columns.
      #
      # The probe builds an actual cgo package, because the cheaper questions
      # are all the wrong one. "Is cc in PATH" passes on an image shipping a
      # stub. "Does cc compile a C file" passes on windows-11-arm, whose
      # compiler targets x86: it built the probe happily and then the real
      # build died assembling Go's own runtime/cgo for arm64
      # ("gcc_arm64.S: no such instruction: stp"). Only cgo itself exercises
      # the compiler, the assembler and the target architecture together,
      # which is what has to work.
      - name: can this runner build cgo
        run: |
          d=$(mktemp -d)
          cat > "$d/main.go" <<'PROBE'
          package main

          /*
          #include <stdint.h>
          static uint64_t probe(uint64_t x) { return x + 1; }
          */
          import "C"

          func main() { _ = C.probe(1) }
          PROBE
          (cd "$d" && go mod init probe >/dev/null 2>&1)
          if (cd "$d" && CGO_ENABLED=1 go build -o probe . >/dev/null 2>&1); then
            echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "cgo builds here ($(go env CC)); the C reference columns will be present"
          else
            echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
            echo "cgo does not build here ($(go env CC)); the C reference columns will be absent"
          fi
          rm -rf "$d"
      - name: what this runner is
        run: |
          set +e
          echo "runner=${{ matrix.runner }}" | tee cpu.txt
          echo "cgo=${CGO_ENABLED}" | tee -a cpu.txt
          (nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null) | sed 's/^/nproc=/' | tee -a cpu.txt
          grep -m1 -E 'model name|Model name' /proc/cpuinfo 2>/dev/null | tee -a cpu.txt
          lscpu 2>/dev/null | grep -E 'Model name|Vendor|Flags|Features|Architecture|MHz|Thread|Core|Socket' | tee -a cpu.txt
          cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1 2>/dev/null | sed 's/^/midr_el1=/' | tee -a cpu.txt
          sysctl -n machdep.cpu.brand_string 2>/dev/null | sed 's/^/brand=/' | tee -a cpu.txt
          (gcc --version 2>/dev/null || cc --version 2>/dev/null) | head -1 | sed 's/^/cc=/' | tee -a cpu.txt
          go version | tee -a cpu.txt
          go test -run 'TestBackendName|TestBackendsNative' -v ./xxh3 ./xxh64 ./rapidhash 2>&1 | grep -E 'dispatched|Backend' | tee -a cpu.txt
      - name: comparison benchmarks (bench module)
        run: |
          cd bench
          go test -run xxx -bench 'Compare' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m . 2>&1 | tee ../compare.txt
      - name: kernel-level backend benchmarks
        run: |
          go test -run xxx -bench 'BenchmarkBackends|BenchmarkSum64Seed|BenchmarkFixed|BenchmarkDigest' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m ./xxh3 2>&1 | tee backends.txt
          go test -run xxx -bench 'BenchmarkBackends|BenchmarkDigest' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m ./xxh64 2>&1 | tee xxh64.txt
          go test -run xxx -bench 'BenchmarkSum64|BenchmarkBackends' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m ./rapidhash 2>&1 | tee rapidhash.txt
      - name: per-length sweep 0..255
        run: |
          cd bench && go run ./sweep -max 255 2>&1 | tee ../sweep.csv
      # Each log is labelled with where it came from. A benchmark name is
      # unique only within a package, and all three packages have a Backends,
      # a Digest or a Sum64Seed -- concatenated into one document unlabelled,
      # the reader cannot tell which table is which. The comparison log needs
      # no label: its names say Compare already.
      - name: markdown tables
        run: |
          cd bench
          set -- "compare:" "backends:xxh3" "xxh64:xxh64" "rapidhash:rapidhash"
          for spec in "$@"; do
            f=${spec%%:*}
            lbl=${spec#*:}
            [ -s "../$f.txt" ] || continue
            if [ -n "$lbl" ]; then
              go run ./mdtable -label "$lbl" -level 3 < "../$f.txt" > "../$f.md"
            else
              go run ./mdtable -level 3 < "../$f.txt" > "../$f.md"
            fi
          done
          if [ -s ../compare.md ]; then
            echo "## bench ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
            cat ../compare.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: |
            cpu.txt
            compare.txt
            compare.md
            backends.txt
            backends.md
            xxh64.txt
            xxh64.md
            rapidhash.txt
            rapidhash.md
            sweep.csv

  publish:
    name: publish benchmarks.md
    needs: bench
    # always(), because fail-fast is off and a runner that failed should not
    # cost the results of the ones that worked -- mkbenchmarks lists it as
    # missing instead. Dispatch only: a bench-* pull request must not push to
    # the default branch.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: bench-*
      - name: compose benchmarks.md
        run: bash bench/mkbenchmarks.sh artifacts > benchmarks.md
      - name: commit it back
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- benchmarks.md)" ]; then
            echo "benchmarks.md is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks.md
          git commit -m "Update benchmarks.md from run ${{ github.run_id }} [skip ci]"
          # The sweep takes long enough that main can move under it. Rebase
          # onto whatever landed and try again; benchmarks.md is generated
          # wholesale, so there is nothing to merge.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git fetch --quiet origin main
            git rebase --quiet origin/main || git rebase --abort || true
          done
          echo "::error::could not push benchmarks.md after three attempts"
          exit 1
