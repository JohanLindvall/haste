name: bench

# A benchmark sweep on every hardware GitHub offers, run by hand: every
# comparison benchmark in bench/, the kernel-level backend benchmarks of
# both packages, and the per-length sweep. Results are uploaded raw; the
# analysis happens elsewhere. Runner VMs are shared and noisy, so numbers
# from here are for shape and ratios, not for the README.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "benchmark repetitions (-count)"
        default: "3"
  # A pull request runs it too: that is how the sweep is started from a
  # branch, since a dispatch needs the workflow to exist on the default branch
  # first. Only pull requests from a branch named bench-* run it, so ordinary
  # pull requests do not pay for a sweep.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    name: bench ${{ matrix.runner }}
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'bench-')
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Every OS/architecture family the standard runners offer.
        # ubuntu-22.04 used to be a row; its image starts brownouts on
        # 2026-09-17 (actions/runner-images#14254), and it was the same x86
        # pool as 24.04 under an older image anyway. macos-latest is Apple
        # silicon -- the wide-vector core the NEON hybrid gating declines --
        # and macos-15-intel is the one x86 pool that is not an Azure VM.
        # The windows rows run under bash; a row whose image has no C
        # compiler just loses the C reference columns, nothing else.
        runner:
          - ubuntu-24.04-arm
          - ubuntu-24.04
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The root module has no go.sum; the cache keys on the bench
          # module's, which every step here builds against.
          cache-dependency-path: bench/go.sum
      - name: what this runner is
        run: |
          set +e
          echo "runner=${{ matrix.runner }}" | tee cpu.txt
          (nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null) | sed 's/^/nproc=/' | tee -a cpu.txt
          grep -m1 -E 'model name|Model name' /proc/cpuinfo 2>/dev/null | tee -a cpu.txt
          lscpu 2>/dev/null | grep -E 'Model name|Vendor|Flags|Features|Architecture|MHz|Thread|Core|Socket' | tee -a cpu.txt
          cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1 2>/dev/null | sed 's/^/midr_el1=/' | tee -a cpu.txt
          sysctl -n machdep.cpu.brand_string 2>/dev/null | sed 's/^/brand=/' | tee -a cpu.txt
          (gcc --version 2>/dev/null || cc --version 2>/dev/null) | head -1 | sed 's/^/cc=/' | tee -a cpu.txt
          go version | tee -a cpu.txt
          go test -run 'TestBackendName|TestBackendsNative' -v . ./xxh64 2>&1 | grep -E 'dispatched|Backend' | tee -a cpu.txt
      - name: comparison benchmarks (bench module)
        run: |
          cd bench
          go test -run xxx -bench 'Compare' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m . 2>&1 | tee ../compare.txt
      - name: kernel-level backend benchmarks
        run: |
          go test -run xxx -bench 'BenchmarkBackends|BenchmarkSum64Seed|BenchmarkFixed|BenchmarkDigest' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m . 2>&1 | tee backends.txt
          go test -run xxx -bench 'BenchmarkBackends|BenchmarkDigest' -count ${{ inputs.count || 3 }} -cpu 1 -timeout 60m ./xxh64 2>&1 | tee xxh64.txt
      - name: per-length sweep 0..255
        run: |
          cd bench && go run ./sweep -max 255 2>&1 | tee ../sweep.csv
      - name: markdown tables
        run: |
          cd bench
          for f in compare backends xxh64; do
            if [ -s "../$f.txt" ]; then
              go run ./mdtable < "../$f.txt" > "../$f.md"
            fi
          done
          if [ -s ../compare.md ]; then
            echo "## bench ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
            cat ../compare.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.runner }}
          path: |
            cpu.txt
            compare.txt
            compare.md
            backends.txt
            backends.md
            xxh64.txt
            xxh64.md
            sweep.csv

  publish:
    name: publish benchmarks.md
    needs: bench
    # always(), because fail-fast is off and a runner that failed should not
    # cost the results of the ones that worked -- mkbenchmarks lists it as
    # missing instead. Dispatch only: a bench-* pull request must not push to
    # the default branch.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: bench-*
      - name: compose benchmarks.md
        run: bash bench/mkbenchmarks.sh artifacts > benchmarks.md
      - name: commit it back
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- benchmarks.md)" ]; then
            echo "benchmarks.md is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks.md
          git commit -m "Update benchmarks.md from run ${{ github.run_id }} [skip ci]"
          # The sweep takes long enough that main can move under it. Rebase
          # onto whatever landed and try again; benchmarks.md is generated
          # wholesale, so there is nothing to merge.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git fetch --quiet origin main
            git rebase --quiet origin/main || git rebase --abort || true
          done
          echo "::error::could not push benchmarks.md after three attempts"
          exit 1
